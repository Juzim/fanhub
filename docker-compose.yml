services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fanhub}
      POSTGRES_USER: ${DB_USER:-fanhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fanhub}
    volumes:
      - fanhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fanhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - fanhub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - fanhub_static:/app/staticfiles
      - fanhub_media:/app/media
    ports:
      - "8000:8000"

volumes:
  fanhub_pgdata:
  fanhub_redisdata:
  fanhub_static:
  fanhub_media:
