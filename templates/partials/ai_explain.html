{% if explanation %}
<div class="ai-explain ai-explain--{{ explanation.mode }}">
  <svg class="ai-explain-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    {% if explanation.mode == "collaborative" %}
    <circle cx="9" cy="7" r="3"/><path d="M2 20a7 7 0 0114 0M16 8a3 3 0 010 6M17 14a6 6 0 015 6"/>
    {% elif explanation.mode == "own_history" %}
    <path d="M12 8v5l3 3"/><circle cx="12" cy="12" r="9"/>
    {% else %}
    <path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 8v4M12 16h.01"/>
    {% endif %}
  </svg>
  <div>
    <div class="ai-explain-headline">{{ explanation.headline }}</div>
    <div class="ai-explain-detail">{{ explanation.detail }}</div>
  </div>
</div>
{% endif %}
