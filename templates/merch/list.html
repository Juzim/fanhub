{% extends "base.html" %}
{% block title %}Мерч{% endblock %}
{% block content %}
<div class="rec-grid" style="grid-template-columns:repeat(4,1fr);">
  {% for p in products %}
  <a href="{% url 'merch:detail' p.pk %}" class="rec-card">
    <div class="rec-thumb product-thumb">
      {% include "partials/product_photo.html" with product=p %}
      <span class="tag">{{ p.club.short_name }}</span>
    </div>
    <div class="rec-body"><div class="t">{{ p.name }}</div><div class="m">от {{ p.price }} ₸</div></div>
  </a>
  {% empty %}<p style="color:var(--text-3);">Товаров пока нет.</p>{% endfor %}
</div>
{% endblock %}
