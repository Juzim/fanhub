{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Вход" %}{% endblock %}
{% block guest_content %}
<div class="auth-shell">
  <form method="post" action="{% url 'set_language' %}" class="lang-switch" style="position:absolute;top:20px;right:20px;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="ru" class="lang-btn {% if LANGUAGE_CODE == 'ru' %}active{% endif %}">RU</button>
    <button type="submit" name="language" value="kk" class="lang-btn {% if LANGUAGE_CODE == 'kk' %}active{% endif %}">ҚАЗ</button>
  </form>
  <div class="formcard">
    <div class="mark"></div>
    <h3 class="title-sm">FAN-HUB</h3>
    <p class="muted" style="margin-bottom:18px;">{% trans "Всё о Казахстанской Премьер-лиге в одном месте" %}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <input type="text" name="username" placeholder="{% trans 'Email / Username' %}" required autofocus>
      <input type="password" name="password" placeholder="{% trans 'Пароль' %}" required>
      <button type="submit" class="cta">{% trans "Войти" %}</button>
    </form>
    <a href="{% url 'accounts:register' %}" class="cta outline" style="margin-top:10px;display:block;">{% trans "Зарегистрироваться" %}</a>
  </div>
</div>
{% endblock %}
