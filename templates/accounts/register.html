{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block guest_content %}
<div class="auth-shell">
  <div class="formcard">
    <div class="mark"></div>
    <h3 class="title-sm">Создать аккаунт</h3>
    <p class="muted" style="margin-bottom:18px;">Выберите любимый клуб — дашборд подстроится под него</p>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        {{ field.errors }}
        {{ field }}
      {% endfor %}
      <button type="submit" class="cta">Зарегистрироваться</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="cta outline" style="margin-top:10px;display:block;">Уже есть аккаунт? Войти</a>
  </div>
</div>
{% endblock %}
